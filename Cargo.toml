[package]
name = "tmux-mcp"
version = "0.2.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
snafu = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
rmcp = { version = "0.13", features = ["server", "transport-io", "macros"] }
regex = "1"
fs2 = "0.4"
hostname = "0.4"
tokio-util = "0.7"
alacritty_terminal = { version = "0.26.0", default-features = false }
vte = { version = "0.15.0", features = ["ansi"] }
brush-parser = "0.3"
toml = "1"
globset = "0.4"
notify = "7"
cel-parser = "0.10"
percent-encoding = "2"
memchr = "2"

[dev-dependencies]
tempfile = "3.27.0"
rmcp = { version = "0.13", features = ["client"] }
