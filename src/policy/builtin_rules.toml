action = "ask"

# awk_is_plain / sed_is_plain: true only for a program that neither runs a command nor opens a
# file of its own; anything they cannot vouch for is false. One rule per command, since each
# reads only the names that its grammar declares.

[[rules]]
id = "awk-program"
command = "awk"
when = '''
  args.file != [] || args.program != null && !awk_is_plain(args.program)
  || args.source.exists(p, !awk_is_plain(p))
'''
action = "ask"
message = "the awk program can run a command or open a file: system(), a | pipe, a > redirect, getline < file, or a program file"

[[rules]]
id = "gawk-program"
command = "gawk"
when = '''
  args.file != [] || args.program != null && !awk_is_plain(args.program)
  || args.source.exists(p, !awk_is_plain(p))
'''
action = "ask"
message = "the awk program can run a command or open a file: system(), a | pipe, a > redirect, getline < file, or a program file"

[[rules]]
id = "mawk-program"
command = "mawk"
when = 'args.file != [] || args.program != null && !awk_is_plain(args.program)'
action = "ask"
message = "the awk program can run a command or open a file: system(), a | pipe, a > redirect, getline < file, or a program file"

[[rules]]
id = "nawk-program"
command = "nawk"
when = 'args.file != [] || args.program != null && !awk_is_plain(args.program)'
action = "ask"
message = "the awk program can run a command or open a file: system(), a | pipe, a > redirect, getline < file, or a program file"

[[rules]]
id = "sed-script"
command = "sed"
when = '''
  args.file != [] || args.script != null && !sed_is_plain(args.script)
  || args.expression.exists(s, !sed_is_plain(s))
'''
action = "ask"
message = "the sed script can run a command or open a file: e, s///e, w, r, or a script file"

