# =============================================================================
# Rules: code from text (deny)
# =============================================================================

[[rules]]
id = "eval"
via = ["tmux", "bash"]
command = "eval"
action = "deny"
message = "eval executes arbitrary strings"

[[rules]]
id = "source"
via = ["tmux", "bash"]
command = "source"
action = "deny"
message = "source executes file contents"

[[rules]]
id = "dot-source"
via = ["tmux", "bash"]
command = "."
action = "deny"
message = "source executes file contents"

[[rules]]
id = "exec"
via = ["tmux", "bash"]
command = "exec"
action = "deny"
message = "exec replaces the shell process"

[[rules]]
id = "sh-reads-stdin"
via = ["tmux", "bash"]
command = "sh"
when = 'args.command == [] && args.file == null'
action = "deny"
message = "dynamic command dispatch isn't allowed: with neither -c nor a script file, the shell runs what it reads from standard input"

[[rules]]
id = "bash-reads-stdin"
via = ["tmux", "bash"]
command = "bash"
when = 'args.command == [] && args.file == null'
action = "deny"
message = "dynamic command dispatch isn't allowed: with neither -c nor a script file, the shell runs what it reads from standard input"

[[rules]]
id = "dash-reads-stdin"
via = ["tmux", "bash"]
command = "dash"
when = 'args.command == [] && args.file == null'
action = "deny"
message = "dynamic command dispatch isn't allowed: with neither -c nor a script file, the shell runs what it reads from standard input"

[[rules]]
id = "zsh-reads-stdin"
via = ["tmux", "bash"]
command = "zsh"
when = 'args.command == [] && args.file == null'
action = "deny"
message = "dynamic command dispatch isn't allowed: with neither -c nor a script file, the shell runs what it reads from standard input"

[[rules]]
id = "git-config-command"
via = ["tmux", "bash"]
command = "git"
when = 'args.config != [] || args.config_env != [] || args.exec_path'
action = "deny"
message = "git -c and --exec-path can set a command to run (core.pager, core.sshCommand, …); set it in the repository's config instead"

# =============================================================================
# Rules: lints (deny, with a message that says how to fix the command)
# =============================================================================

# A command at the end of a pipeline: `command.op_before == "|"` and nothing piped on.

[[rules]]
id = "pipe-to-tail"
command = "tail"
when = 'command.top && command.op_before == "|" && command.op_after != "|"'
action = "deny"
message = '''
Don't pipe to tail — use the tail parameter instead.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}", tail={{ or(last(args.lines), "20") }})

This preserves full output in history. Use command_read(search=...) to search it later.'''

[[rules]]
id = "pipe-to-head"
command = "head"
when = 'command.top && command.op_before == "|" && command.op_after != "|"'
action = "deny"
message = '''
Don't pipe to head — use the head parameter instead.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}", head={{ or(last(args.lines), "20") }})

This preserves full output in history. Use command_read(search=...) to search it later.'''

[[rules]]
id = "pipe-to-grep"
command = "grep"
when = 'command.top && command.op_before == "|" && command.op_after != "|"'
action = "deny"
message = '''
Don't pipe to grep — use the search parameter instead.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}", search="{{ or(args.pattern, or(last(args.regexp), "pattern")) }}")

search supports full regex. This preserves full output for multiple different searches.'''

[[rules]]
id = "pipe-to-egrep"
command = "egrep"
when = 'command.top && command.op_before == "|" && command.op_after != "|"'
action = "deny"
message = '''
Don't pipe to egrep — use the search parameter instead.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}", search="{{ or(args.pattern, or(last(args.regexp), "pattern")) }}")

search supports full regex. This preserves full output for multiple different searches.'''

[[rules]]
id = "pipe-to-fgrep"
command = "fgrep"
when = 'command.top && command.op_before == "|" && command.op_after != "|"'
action = "deny"
message = '''
Don't pipe to fgrep — use the search parameter instead.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}", search="{{ or(args.pattern, or(last(args.regexp), "pattern")) }}")

search supports full regex. This preserves full output for multiple different searches.'''

[[rules]]
id = "pipe-to-rg"
command = "rg"
when = 'command.top && command.op_before == "|" && command.op_after != "|"'
action = "deny"
message = '''
Don't pipe to rg — use the search parameter instead.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}", search="{{ or(args.pattern, or(last(args.regexp), "pattern")) }}")

search supports full regex. This preserves full output for multiple different searches.'''

[[rules]]
id = "pipe-to-tee"
command = "tee"
when = 'command.top && command.op_before == "|" && command.op_after != "|"'
action = "deny"
message = '''
Don't pipe to tee — output is already saved in command history.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}")

Use command_read to access full output as many times as needed.'''

# echo/printf of `$?` as the line's last command, alone in its pipeline, with no redirect (which
# would keep the value somewhere).

[[rules]]
id = "echo-status"
when = '''
  command.top && command.name in ["echo", "printf"] && "?" in command.expands && command.redirects == []
  && command.op_after == null && command.op_before != null && command.op_before != "|"
'''
action = "deny"
message = '''
Don't echo $? — command_run already reports each command's exit code.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}")

The exit status of the last command is captured and shown automatically; reading it back with echo just duplicates it. To branch on the status, use it directly (e.g. `cmd && on_success || on_failure`).'''

[[rules]]
id = "echo-status-alone"
when = '''
  command.top && command.name in ["echo", "printf"] && "?" in command.expands && command.redirects == []
  && command.op_before == null && command.op_after == null
'''
action = "deny"
message = '''
Don't re-run a command to read $? — use the command_history tool.

Rejected:    command_run(command="{{ line }}")

command_history lists recent commands with their exit codes, captured directly when each command finished. A bare `echo $?` in a new command_run is fragile: the shell prompt runs between runs and can reset $?.'''

# A constant echo/printf: a progress marker that runs unconditionally, or a success marker that
# only restates the exit code. `|| echo fail` changes the exit code, so it passes.

[[rules]]
id = "constant-echo"
when = '''
  command.top && command.name in ["echo", "printf"] && command.constant && command.redirects == []
  && !(command.op_before in ["|", "&&", "||"]) && command.op_after != "|"
'''
action = "deny"
message = '''
Don't run echo/printf with only constant text — its output is already known.

Rejected:  command_run(command="{{ line }}")
Marker:    {{ command.text }}

A top-level echo of a fixed string is almost always a leftover progress marker (e.g. "=== Building ==="). command_run tracks each command separately — output, exit code, and a command_history entry — so markers between commands add nothing. Run the real commands as separate command_run calls. To inspect a value, echo the variable itself (e.g. echo "$VAR"), which this lint allows.'''

[[rules]]
id = "constant-success-echo"
when = '''
  command.top && command.name in ["echo", "printf"] && command.constant && command.redirects == []
  && command.op_before == "&&" && command.op_after == null
'''
action = "deny"
message = '''
Don't echo a constant success marker — command_run reports the exit code.

Rejected:  command_run(command="{{ line }}")
Try:       command_run(command="{{ drop(command) }}")

A trailing `&& echo …` runs only when the preceding command succeeds, so it just restates the exit status that command_run already captures for the last command. Drop it — the reported exit code tells you whether the command succeeded. (`|| echo fail` isn't needed either; a non-zero exit code is shown automatically.)'''

[[rules]]
id = "stderr-to-stdout"
when = 'command.top && command.op_after == null && "2>&1" in command.redirects'
action = "deny"
message = '''
Don't redirect stderr — it's already captured.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command, "2>&1") }}")

Both stdout and stderr are visible in the terminal and captured automatically.'''

[[rules]]
id = "background"
when = 'command.top && command.op_after == "&"'
action = "deny"
message = '''
Don't background commands with & — use a separate pane instead.

Rejected:    command_run(command="{{ line }}")

Background jobs bypass output capture and can't be monitored reliably. Use list_panes to find or create another pane and run the command there.'''

# `cd <the pane's directory> && …`: the cd changes nothing. `sure`: never on an Unknown directory.

[[rules]]
id = "redundant-cd"
command = "cd"
when = '''
  command.top && command.op_before == null && command.op_after in ["&&", ";"]
  && sure(command.cwd == command.shell_cwd)
'''
action = "deny"
message = '''
Redundant cd — the pane is already in that directory.

Instead of:  command_run(command="{{ line }}")
Try:         command_run(command="{{ drop(command) }}")

The pane's working directory is already {{ command.shell_cwd }}.'''

# Through Bash, these run unseen and out of the user's shell history; in a pane
# the user watches them, answers their prompts, and finds them again. A project
# lifts one with an allow that has `via = "bash"` and exempts the rule's id.
# Cargo's everyday subcommands stay on Bash; only `cargo install` goes to a pane.

[[rules]]
id = "prefer-tmux"
via = "bash"
command = ["make", "npm", "cargo"]
when = 'command.name != "cargo" || subcommand == "install"'
action = "deny"
message = '''
Run this in a tmux pane, where the user can watch it:

  command_run(command="{{ line }}")

Use list_panes to pick the pane.'''

[[rules]]
id = "ssh-in-a-pane"
via = "bash"
when = 'command.name in ["ssh", "mosh"]'
action = "deny"
message = '''
Run this in a tmux pane, where the user can watch it and answer its prompts.
A one-off remote command needs only:

  command_run(command="{{ line }}")

To open a session:

1. command_run(command="{{ line }}", timeout_secs=0) sends it and returns.
2. debug_pane until the remote shell's prompt shows. A password, passphrase or
   host-key prompt is the user's to answer.
3. inject_osc133 on the pane, so command_run can track the remote commands.
4. list_panes: the pane's Cwd names the remote host and Integration is confirmed.

Then run commands in that pane with command_run.'''

[[rules]]
id = "transfer-in-a-pane"
via = "bash"
when = 'command.name in ["scp", "sftp", "rsync"]'
action = "deny"
message = '''
Run this in a tmux pane, where the user can watch the transfer:

  command_run(command="{{ line }}")

Keep timeout_secs low and follow a long transfer with command_read. sftp's
interactive session can't be driven by command_run; use scp or rsync.'''

[[rules]]
id = "database-in-a-pane"
via = "bash"
when = 'command.name in ["psql", "mysql", "mariadb", "mongosh", "redis-cli"]'
action = "deny"
message = '''
Run this in a tmux pane, with the query on the command line (psql -c or -f,
mysql -e, mongosh --eval, redis-cli's arguments):

  command_run(command="{{ line }}")

command_run can't drive an interactive client session.'''

[[rules]]
id = "infra-in-a-pane"
via = "bash"
when = '''command.name in [
  "kubectl", "helm", "k9s", "kubectx", "kubens", "argocd", "eksctl", "terraform", "tofu",
  "pulumi", "ansible", "ansible-playbook", "packer", "vault", "aws", "gcloud", "gsutil", "bq",
  "az", "doctl", "flyctl",
]'''
action = "deny"
message = '''
Run this in a tmux pane: it acts with the user's credentials and context, and
the user can watch it and find it in their history.

  command_run(command="{{ line }}")

A command that asks for confirmation (terraform apply) waits for the user's
answer in the pane. Use list_panes to pick the pane.'''

[[rules]]
id = "system-switch-in-a-pane"
via = "bash"
when = 'command.name in ["nixos-rebuild", "home-manager", "darwin-rebuild"]'
action = "deny"
message = '''
Run this in a tmux pane: it runs long and may ask for the user's sudo password
there.

  command_run(command="{{ line }}")

Keep timeout_secs low and follow it with command_read.'''

# What renders, formats or checks local files runs fine through Bash.

[[rules]]
id = "helm-local"
via = "bash"
command = "helm"
when = 'subcommand in ["template", "lint", "show", "create", "package", "version"]'
action = "allow"
exempts = ["infra-in-a-pane"]

[[rules]]
id = "terraform-local"
via = "bash"
command = ["terraform", "tofu"]
when = 'subcommand in ["fmt", "validate", "version"]'
action = "allow"
exempts = ["infra-in-a-pane"]

[[rules]]
id = "kubectl-kustomize"
via = "bash"
command = "kubectl kustomize"
action = "allow"
exempts = ["infra-in-a-pane"]

[[rules]]
id = "kubectl-client-dry-run"
via = "bash"
command = "kubectl create"
when = 'args.dry_run == ["client"]'
action = "allow"
exempts = ["infra-in-a-pane"]

# The tmux CLI reaches the panes around tmux-mcp: no command tracking, no
# policy, and keystrokes into a shell the person may be typing in.

[[rules]]
id = "tmux-cli"
via = "bash"
command = "tmux"
action = "deny"
message = '''
Don't drive tmux from Bash. Use the tmux-mcp tools: list_panes to find a pane,
command_run to run in it, command_read to read output, press_key for keys.'''

# =============================================================================
# Rules: paths
# =============================================================================

[[rules]]
id = "outside-project"
path = '!in_project(path) && !is_device(path)'
action = "ask"
message = "a path outside the project"

# =============================================================================
# Rules: commands that change state (ask)
# =============================================================================

[[rules]]
id = "variable-runs-code"
when = '''
  variables.exists(v, v in ["PATH", "LD_PRELOAD", "LD_LIBRARY_PATH", "LD_AUDIT", "BASH_ENV", "ENV",
                            "PROMPT_COMMAND", "PS4", "SHELLOPTS", "BASHOPTS", "IFS", "CDPATH",
                            "GIT_SSH", "GIT_SSH_COMMAND", "GIT_EXTERNAL_DIFF", "GIT_PAGER", "GIT_EDITOR",
                            "GIT_EXEC_PATH", "GIT_CONFIG_PARAMETERS", "GIT_CONFIG_GLOBAL", "PAGER",
                            "EDITOR", "VISUAL", "LESSOPEN", "LESSCLOSE", "PYTHONPATH", "PYTHONSTARTUP",
                            "NODE_OPTIONS", "PERL5OPT", "RUBYOPT", "RUSTC_WRAPPER", "CARGO_TARGET_DIR"]
                || startsWith(v, "BASH_FUNC_") || startsWith(v, "GIT_CONFIG_"))
'''
action = "ask"
message = "the variable can make a later command run another program"

[[rules]]
id = "privilege-escalation"
via = ["tmux", "bash"]
when = 'command.name in ["su", "doas"]'
action = "ask"

[[rules]]
id = "rm-r"
via = ["tmux", "bash"]
command = "rm"
when = 'args.recursive'
action = "ask"

[[rules]]
id = "find-delete"
via = ["tmux", "bash"]
command = "find"
when = 'args.delete'
action = "ask"

[[rules]]
id = "rg-runs-program"
via = ["tmux", "bash"]
command = "rg"
when = 'args.pre != [] || args.hostname_bin != []'
action = "ask"
message = "--pre and --hostname-bin run the program they name"

# git push: one rule per way it rewrites or deletes remote branches, so that an exemption names one.

[[rules]]
id = "git-push-force"
via = ["tmux", "bash"]
command = "git push"
when = 'args.force || args.force_with_lease || args.force_if_includes || args.refspecs.exists(r, startsWith(r, "+"))'
action = "ask"

[[rules]]
id = "git-push-delete"
via = ["tmux", "bash"]
command = "git push"
when = 'args.delete || args.refspecs.exists(r, startsWith(r, ":"))'
action = "ask"

[[rules]]
id = "git-push-mirror"
via = ["tmux", "bash"]
command = "git push"
when = 'args.mirror'
action = "ask"

[[rules]]
id = "git-push-prune"
via = ["tmux", "bash"]
command = "git push"
when = 'args.prune'
action = "ask"

[[rules]]
id = "git-reset-hard"
via = ["tmux", "bash"]
command = "git reset"
when = 'args.hard'
action = "ask"

[[rules]]
id = "git-clean-force"
via = ["tmux", "bash"]
command = "git clean"
when = 'args.force'
action = "ask"

# awk_is_plain / sed_is_plain: true only for a program that neither runs a command nor opens a
# file of its own; anything they cannot vouch for is false.

[[rules]]
id = "awk-program"
command = ["awk", "gawk", "mawk", "nawk"]
when = '''
  args.file != [] || args.program != null && !awk_is_plain(args.program)
  || args.source.exists(p, !awk_is_plain(p))
'''
action = "ask"
message = "the awk program can run a command or open a file: system(), a | pipe, a > redirect, getline < file, or a program file"

[[rules]]
id = "sed-script"
command = "sed"
when = '''
  args.file != [] || args.script != null && !sed_is_plain(args.script)
  || args.expression.exists(s, !sed_is_plain(s))
'''
action = "ask"
message = "the sed script can run a command or open a file: e, s///e, w, r, or a script file"

[[rules]]
id = "disk-and-filesystem"
via = ["tmux", "bash"]
when = 'command.name in ["dd", "mkfs", "fdisk", "mount", "umount"]'
action = "ask"

[[rules]]
id = "system-power"
via = ["tmux", "bash"]
when = 'command.name in ["reboot", "shutdown", "poweroff", "halt"]'
action = "ask"

[[rules]]
id = "process-signals"
when = 'command.name in ["kill", "pkill", "killall"]'
action = "ask"

# On Bash, auto mode judges an ordinary signal; SIGKILL leaves the process no chance to clean up.
# kill's rare `-n 9` spelling is left to auto mode.
[[rules]]
id = "sigkill"
via = "bash"
command = ["kill", "pkill", "killall"]
when = 'args.signal.exists(s, matches(s, "(?i)^(sig)?kill$|^9$"))'
action = "ask"
message = "SIGKILL leaves the process no chance to clean up"

[[rules]]
id = "package-remove"
via = ["tmux", "bash"]
command = ["apt", "apt-get", "dnf", "yum"]
when = 'subcommand in ["remove", "purge", "erase", "autoremove"]'
action = "ask"

[[rules]]
id = "pacman-remove"
via = ["tmux", "bash"]
command = "pacman"
when = 'args.remove'
action = "ask"

[[rules]]
id = "firewall"
via = ["tmux", "bash"]
when = 'command.name in ["iptables", "ufw", "firewall-cmd"]'
action = "ask"

[[rules]]
id = "service-disruption"
via = ["tmux", "bash"]
command = "systemctl"
when = 'subcommand in ["stop", "disable", "mask", "restart"]'
action = "ask"

[[rules]]
id = "curl-wget"
when = 'command.name in ["curl", "wget"]'
action = "ask"

[[rules]]
id = "permissions"
when = 'command.name in ["chmod", "chown", "chgrp"]'
action = "ask"

# On Bash, auto mode judges a single file's mode; a recursive change reaches a whole tree.
[[rules]]
id = "permissions-recursive"
via = "bash"
command = ["chmod", "chown", "chgrp"]
when = 'args.recursive'
action = "ask"

[[rules]]
id = "cargo-install"
via = ["tmux", "bash"]
command = "cargo install"
action = "ask"
message = "cargo install downloads and compiles arbitrary code from crates.io"

# =============================================================================
# Rules: allowed (the rules above ask when these reach too far)
# =============================================================================

[[rules]]
id = "info-commands"
when = '''
  command.name in [null, "echo", "printf", "pwd", "whoami", "hostname", "date", "uname", "id",
                   "which", "ps", "uptime", "seq", "sleep", "true", "false", "test", "[", ":", "type",
                   "man", "tr"]
'''                                                   # null: a line that only assigns or redirects
action = "allow"

# A command that runs an inner command is allowed; the inner command meets the rules itself, in
# the context the outer command gives it.

[[rules]]
id = "wrappers-and-export"
when = 'command.name in ["timeout", "nice", "nohup", "xargs", "env", "export"]'
action = "allow"

[[rules]]
id = "sudo-with-command"
command = "sudo"
when = 'args.command != [] && !args.edit && !args.shell && !args.login'
action = "allow"

# -o and -F can set a ProxyCommand, which runs on this machine.
[[rules]]
id = "ssh-with-command"
command = "ssh"
when = 'args.command != [] && args.option == [] && args.config == []'
action = "allow"

[[rules]]
id = "shell-c"
command = ["sh", "bash", "dash", "zsh"]
when = 'args.command != []'
action = "allow"

[[rules]]
id = "cd-pushd-popd"
when = 'command.name in ["cd", "pushd", "popd"]'
action = "allow"

[[rules]]
id = "file-tools"
when = '''
  command.name in ["cat", "less", "more", "wc", "file", "stat", "realpath", "readlink", "diff",
                   "base64", "md5sum", "sha256sum", "uniq", "head", "tail", "ls", "tree", "cut", "sort",
                   "grep", "egrep", "fgrep", "rg", "find", "mkdir", "rmdir", "touch", "tee", "cp", "mv",
                   "ln", "rm", "sed", "awk", "gawk", "mawk", "nawk"]
'''
action = "allow"

[[rules]]
id = "cargo"
command = "cargo"
action = "allow"

[[rules]]
id = "git-reads"
command = "git"
when = '''
  subcommand in ["status", "log", "diff", "show", "shortlog", "blame", "ls-files", "ls-tree",
                 "rev-parse", "describe", "cat-file", "grep"]
'''
action = "allow"

[[rules]]
id = "git-remote-listings"
command = "git remote"
when = 'subcommand in [null, "show", "get-url"]'
action = "allow"

[[rules]]
id = "git-stash-listings"
command = "git stash"
when = 'subcommand in ["list", "show"]'
action = "allow"

[[rules]]
id = "git-reflog-listings"
command = "git reflog"
when = 'subcommand in [null, "show"]'
action = "allow"

[[rules]]
id = "git-branch-listings"
command = "git branch"
when = '''
  (args.list || args.names == [])
  && !(args.delete || args.force_delete || args.move || args.force_move || args.copy || args.force_copy
       || args.unset_upstream || args.edit_description || args.set_upstream_to != [])
'''
action = "allow"

[[rules]]
id = "git-tag-listings"
command = "git tag"
when = '(args.list || args.names == []) && !args.delete'
action = "allow"

[[rules]]
id = "git-config-reads"
command = "git config"
when = '''
  !(args.unset || args.unset_all || args.add || args.replace_all || args.edit
    || args.rename_section || args.remove_section)
  && (args.list || args.get || args.get_all || args.get_regexp
      || args.names.size() == 1 || args.names.size() > 0 && args.names[0] in ["get", "list"])
'''
action = "allow"
