# =============================================================================
# Rules: allowed (the rules above ask when these reach too far)
# =============================================================================

[[rules]]
id = "info-commands"
when = '''
  command.name in [null, "echo", "printf", "pwd", "whoami", "hostname", "date", "uname", "id",
                   "which", "ps", "uptime", "seq", "sleep", "true", "false", "test", "[", ":", "type",
                   "man", "tr"]
'''                                                   # null: a line that only assigns or redirects
action = "allow"

# A command that runs an inner command is allowed; the inner command meets the rules itself, in
# the context the outer command gives it.

[[rules]]
id = "wrappers-and-export"
when = 'command.name in ["timeout", "nice", "nohup", "xargs", "env", "export"]'
action = "allow"

[[rules]]
id = "sudo-with-command"
command = "sudo"
when = 'args.command != [] && !args.edit && !args.shell && !args.login'
action = "allow"

# -o and -F can set a ProxyCommand, which runs on this machine.
[[rules]]
id = "ssh-with-command"
