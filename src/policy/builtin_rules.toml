# Built-in policy, compiled into the tmux-mcp binary.
#
# A grammar declares what its rules read, every option whose value is a path or a command, and
# the flags agents commonly use with a command the rules allow. Anything else is undeclared,
# which only makes a line ask.

default = "ask"

# =============================================================================
# Readers
# =============================================================================

[commands.cat]
parser = "gnu"
arguments = [
  "files...", "--number|-n", "--number-nonblank|-b", "--show-all|-A", "--show-ends|-E",
  "--show-tabs|-T", "--squeeze-blank|-s", "--show-nonprinting|-v",
]
marks.read = ["files"]

[commands.less]
parser = "gnu"
arguments = [
  "files...", "--log-file|-o|--LOG-FILE|-O:", "--pattern|-p:", "--tag|-t:",
  "raw_ansi=-R", "chop=-S", "line_numbers=-N", "quit_if_one_screen=-F", "no_init=-X", "ignore_case=-i",
]
marks.read = ["files"]
marks.write = ["log_file"]

[commands.more]
parser = "gnu"
arguments = ["files...", "--lines|-n:"]
marks.read = ["files"]

[commands.wc]
parser = "gnu"
arguments = [
  "files...", "--files0-from:", "--lines|-l", "--words|-w", "--bytes|-c", "--chars|-m",
  "--max-line-length|-L",
]
marks.read = ["files", "files0_from"]

[commands.file]
parser = "gnu"
arguments = ["files...", "--files-from|-f:", "--magic-file|-m:", "--brief|-b", "--mime|-i", "--mime-type", "--dereference|-L"]
marks.read = ["files", "files_from", "magic_file"]

[commands.stat]
parser = "gnu"
arguments = ["files...", "--format|-c:", "--printf:", "--dereference|-L", "--file-system|-f", "--terse|-t"]
marks.read = ["files"]

[commands.realpath]
parser = "gnu"
arguments = [
  "files...", "--relative-to:", "--relative-base:", "--canonicalize-existing|-e",
  "--canonicalize-missing|-m", "--no-symlinks|-s", "--quiet|-q",
]
marks.read = ["files", "relative_to", "relative_base"]

[commands.readlink]
parser = "gnu"
arguments = ["files...", "--canonicalize|-f", "--canonicalize-existing|-e", "--canonicalize-missing|-m", "--no-newline|-n"]
marks.read = ["files"]

[commands.diff]
parser = "gnu"
arguments = [
  "files...", "--from-file:", "--to-file:", "--exclude-from|-X:", "--exclude|-x:",
  "--unified|-U:", "--context|-C:", "--label|-L:",
  "-u", "-c", "--recursive|-r", "--new-file|-N", "--brief|-q", "--side-by-side|-y",
  "--ignore-all-space|-w", "--ignore-space-change|-b", "--ignore-blank-lines|-B", "--ignore-case|-i",
  "--text|-a", "--color",
]
marks.read = ["files", "from_file", "to_file", "exclude_from"]

[commands.base64]
parser = "gnu"
arguments = ["files...", "--wrap|-w:", "--decode|-d", "--ignore-garbage|-i"]
marks.read = ["files"]

[commands.md5sum]
parser = "gnu"
arguments = ["files...", "--check|-c", "--binary|-b", "--quiet", "--status", "--tag"]
marks.read = ["files"]

[commands.sha256sum]
parser = "gnu"
arguments = ["files...", "--check|-c", "--binary|-b", "--quiet", "--status", "--tag"]
marks.read = ["files"]

[commands.head]
parser = "gnu"
arguments = ["files...", "--lines|-n:", "--bytes|-c:", "--quiet|--silent|-q", "--verbose|-v"]
argument.lines.dash = true                             # head -5 is head --lines 5
marks.read = ["files"]

[commands.tail]
parser = "gnu"
arguments = [
  "files...", "--lines|-n:", "--bytes|-c:", "--follow|-f", "follow_retry=-F", "--quiet|--silent|-q",
  "--verbose|-v",
]
argument.lines.dash = true                             # tail -5, and a first +5
marks.read = ["files"]

[commands.uniq]
parser = "gnu"
arguments = [
  "input", "output", "--count|-c", "--repeated|-d", "--unique|-u", "--ignore-case|-i",
  "--skip-fields|-f:", "--skip-chars|-s:", "--check-chars|-w:",
]
marks.read = ["input"]
marks.write = ["output"]

[commands.cut]
parser = "gnu"
arguments = [
  "files...", "--fields|-f:", "--delimiter|-d:", "--bytes|-b:", "--characters|-c:",
  "--only-delimited|-s", "--complement", "--output-delimiter:",
]
marks.read = ["files"]

[commands.sort]
parser = "gnu"
arguments = [
  "files...", "--output|-o:", "--temporary-directory|-T:", "--files0-from:", "--key|-k:",
  "--field-separator|-t:", "--numeric-sort|-n", "--reverse|-r", "--unique|-u",
  "--human-numeric-sort|-h", "--version-sort|-V", "--ignore-case|-f", "--ignore-leading-blanks|-b",
  "--stable|-s", "--general-numeric-sort|-g", "--zero-terminated|-z", "--check|-c",
]
marks.read = ["files", "files0_from"]
marks.write = ["output", "temporary_directory"]

[commands.ls]
parser = "gnu"
arguments = [
  "files...", "--ignore|-I:", "--sort:", "--all|-a", "--almost-all|-A", "-l", "--human-readable|-h",
  "-t", "--reverse|-r", "--recursive|-R", "one_per_line=-1", "--directory|-d", "size_sort=-S",
  "--inode|-i", "--classify|-F", "--numeric-uid-gid|-n", "--size|-s", "--color",
  "--group-directories-first",
]
argument.files.default = ["."]
marks.read = ["files"]

[commands.tree]
parser = "gnu"
arguments = [
  "files...", "output=-o:", "level=-L:", "pattern=-P:", "ignore=-I:", "all=-a", "dirs_only=-d",
  "full_path=-f", "human=-h", "colorize=-C", "json=-J", "--gitignore", "--noreport", "--dirsfirst",
]
argument.files.default = ["."]
marks.read = ["files"]
marks.write = ["output"]

# --- Search: grep, egrep, fgrep are three entries on purpose ---

[commands.grep]
parser = "gnu"
arguments = [
  ["pattern", "--regexp|-e:", "--file|-f:"],
  "files...",
  "--exclude-from:", "--include:", "--exclude:", "--exclude-dir:",
  "--after-context|-A:", "--before-context|-B:", "--context|-C:", "--max-count|-m:",
  "--recursive|-r", "--dereference-recursive|-R", "--line-number|-n", "--ignore-case|-i",
  "--files-with-matches|-l", "--files-without-match|-L", "--invert-match|-v", "--word-regexp|-w",
  "--line-regexp|-x", "--count|-c", "--only-matching|-o", "--with-filename|-H", "--no-filename|-h",
  "--extended-regexp|-E", "--fixed-strings|-F", "--perl-regexp|-P", "--no-messages|-s",
  "--quiet|--silent|-q", "--null-data|-z", "--text|-a", "binary_skip=-I", "--color|--colour",
]
marks.read = ["files", "file", "exclude_from"]

[commands.egrep]
parser = "gnu"
arguments = [
  ["pattern", "--regexp|-e:", "--file|-f:"],
  "files...",
  "--exclude-from:", "--include:", "--exclude:", "--exclude-dir:",
  "--after-context|-A:", "--before-context|-B:", "--context|-C:", "--max-count|-m:",
  "--recursive|-r", "--dereference-recursive|-R", "--line-number|-n", "--ignore-case|-i",
  "--files-with-matches|-l", "--files-without-match|-L", "--invert-match|-v", "--word-regexp|-w",
  "--line-regexp|-x", "--count|-c", "--only-matching|-o", "--with-filename|-H", "--no-filename|-h",
  "--extended-regexp|-E", "--fixed-strings|-F", "--perl-regexp|-P", "--no-messages|-s",
  "--quiet|--silent|-q", "--null-data|-z", "--text|-a", "binary_skip=-I", "--color|--colour",
]
marks.read = ["files", "file", "exclude_from"]

[commands.fgrep]
parser = "gnu"
arguments = [
  ["pattern", "--regexp|-e:", "--file|-f:"],
  "files...",
  "--exclude-from:", "--include:", "--exclude:", "--exclude-dir:",
  "--after-context|-A:", "--before-context|-B:", "--context|-C:", "--max-count|-m:",
  "--recursive|-r", "--dereference-recursive|-R", "--line-number|-n", "--ignore-case|-i",
  "--files-with-matches|-l", "--files-without-match|-L", "--invert-match|-v", "--word-regexp|-w",
  "--line-regexp|-x", "--count|-c", "--only-matching|-o", "--with-filename|-H", "--no-filename|-h",
  "--extended-regexp|-E", "--fixed-strings|-F", "--perl-regexp|-P", "--no-messages|-s",
  "--quiet|--silent|-q", "--null-data|-z", "--text|-a", "binary_skip=-I", "--color|--colour",
]
marks.read = ["files", "file", "exclude_from"]

[commands.rg]
parser = "gnu"
arguments = [
  ["pattern", "--regexp|-e:", "--file|-f:"],
  "files...",
  "--ignore-file:", "--pre:", "--hostname-bin:",
  "--after-context|-A:", "--before-context|-B:", "--context|-C:", "--max-count|-m:",
  "--glob|-g:", "--iglob:", "--type|-t:", "--type-not|-T:", "--max-depth|-d:", "--replace|-r:",
  "--sort:", "--sortr:", "--color:",
  "--ignore-case|-i", "--smart-case|-S", "--case-sensitive|-s", "--word-regexp|-w", "--line-regexp|-x",
  "--line-number|-n", "--no-line-number|-N", "--files-with-matches|-l", "--count|-c",
  "--invert-match|-v", "--unrestricted|-u", "--fixed-strings|-F", "--only-matching|-o", "--hidden",
  "--no-ignore", "list_files=--files", "--json", "--follow|-L", "--multiline|-U", "--text|-a", "--heading",
  "--no-heading", "--vimgrep", "--with-filename|-H", "--no-filename", "--pretty|-p", "--quiet|-q",
]
argument.files.default = ["."]                        # with no path, rg searches the directory
marks.read = ["files", "file", "ignore_file"]

[commands.find]
parser = "find"                                       # spellings are single-dash words
arguments = [
  "files...",                                         # the start points
  "follow_links=-L", "follow_args=-H", "no_follow=-P",
  "-delete",
  "-newer:", "-anewer:", "-cnewer:", "-samefile:", "-files0-from:",
  "-fprint:", "-fprint0:", "-fls:", "-fprintf:",
  "-name:", "-iname:", "-path:", "-ipath:", "-wholename:", "-iwholename:",
  "-regex:", "-iregex:", "-lname:", "-ilname:",
  "-type:", "-xtype:", "-perm:", "-size:", "-user:", "-group:", "-uid:", "-gid:",
  "-mtime:", "-mmin:", "-atime:", "-amin:", "-ctime:", "-cmin:", "-maxdepth:", "-mindepth:",
  "-newermt:", "-printf:", "-regextype:",
  "-print", "-print0", "-ls", "-prune", "-quit", "-empty", "-executable", "-readable", "-writable",
  "-depth", "-xdev", "-mount", "-follow", "-true", "-false", "-nouser", "-nogroup", "-daystart",
  "-exec...", "-execdir...", "-ok...", "-okdir...",   # a command up to ";" or "{} +"
]
argument.files.default = ["."]
marks.read = ["files", "newer", "anewer", "cnewer", "samefile", "files0_from"]
marks.write = ["fprint", "fprint0", "fls", "fprintf"]
marks.command = ["exec", "execdir", "ok", "okdir"]
# -execdir and -okdir run their command in each file's directory, which cannot be known.
with.cwd = 'args.execdir == [] && args.okdir == [] ? null : unknown'

# =============================================================================
# Commands that run commands
# =============================================================================

[commands.timeout]
parser = "posix"
arguments = ["duration", "command...", "--signal|-s:", "--kill-after|-k:", "--preserve-status", "--foreground", "--verbose|-v"]
marks.command = ["command"]

[commands.nice]
parser = "posix"
arguments = ["command...", "--adjustment|-n:"]
argument.adjustment.dash = true                        # nice -5 is nice -n 5
marks.command = ["command"]

[commands.nohup]
parser = "posix"
arguments = ["command..."]
marks.command = ["command"]

[commands.xargs]
parser = "posix"
arguments = [
  "command...", "--arg-file|-a:", "--delimiter|-d:", "eof=-E:", "replace=-I:", "max_lines=-L:",
  "--max-args|-n:", "--max-procs|-P:", "--max-chars|-s:", "--process-slot-var:",
  "--null|-0", "--interactive|-p", "--no-run-if-empty|-r", "--verbose|-t", "--exit|-x", "--open-tty|-o",
  "--show-limits",
]
argument.command.default = ["echo"]
argument.command.appends = true                       # xargs adds its input to the command
marks.command = ["command"]
marks.read = ["arg_file"]

[commands.env]
parser = "posix"
arguments = [
  "assigns...", "command...", "--chdir|-C:", "--split-string|-S:", "--unset|-u:",
  "--ignore-environment|-i", "--null|-0", "--debug|-v",
]
argument.assigns.match = "*=*"
marks.variables = ["assigns"]
marks.command = ["command"]
marks.shell = ["split_string"]
with.cwd = 'last(args.chdir)'

[commands.export]
parser = "posix"
arguments = ["names...", "unexport=-n", "functions=-f", "print=-p"]
marks.variables = ["names"]

[commands.sudo]
parser = "posix"
arguments = [
  "command...",
  "--user|-u:", "--group|-g:", "--chdir|-D:", "--close-from|-C:", "--host:", "--prompt|-p:",
  "--role|-r:", "--type|-t:", "--command-timeout|-T:", "--other-user|-U:",
  "--login|-i", "--shell|-s", "--edit|-e", "--preserve-env|-E", "--non-interactive|-n",
  "--background|-b", "--list|-l", "--validate|-v", "--reset-timestamp|-k", "--remove-timestamp|-K",
  "--set-home|-H", "--stdin|-S",
]
argument.user.default = ["root"]
marks.command = ["command"]
with.user = 'last(args.user)'
with.cwd = 'args.login ? home(with.user) : last(args.chdir)'

[commands.ssh]
parser = "posix"                                      # ssh's options end at the destination
arguments = [
  "destination", "command...",
  "bind_interface=-B:", "bind_address=-b:", "cipher_spec=-c:", "dynamic=-D:", "log_file=-E:",
  "escape_char=-e:", "config=-F:", "pkcs11=-I:", "identity_file=-i:", "jump=-J:", "local=-L:",
  "login_name=-l:", "mac_spec=-m:", "control=-O:", "option=-o:", "port=-p:", "query=-Q:",
  "remote=-R:", "control_path=-S:", "forward_stdio=-W:", "tunnel=-w:",
  "ipv4=-4", "ipv6=-6", "agent=-A", "no_agent=-a", "compress=-C", "background=-f", "gateway=-g",
  "no_stdin=-n", "no_command=-N", "quiet=-q", "subsystem=-s", "no_tty=-T", "tty=-t", "verbose=-v",
  "x11=-X", "no_x11=-x", "trusted_x11=-Y",
]
marks.read = ["config", "identity_file"]
marks.write = ["log_file"]
marks.shell = ["command"]                             # ssh joins its words into one remote line
with.host = 'host_of(args.destination)'
with.user = 'or(last(args.login_name), user_of(args.destination))'
with.cwd = 'home(with.user)'

# sh, bash, dash, zsh: four entries on purpose. With -c the line is a shell line; else the first
# operand is a script file, and with neither the shell reads its commands from standard input.

[commands.sh]
parser = "posix"
arguments = [
  ["file", "command=-c:"], "positional...", "option=-o:", "--login|-l", "interactive=-i",
  "errexit=-e", "xtrace=-x", "nounset=-u", "verbose=-v", "noexec=-n", "stdin=-s",
]
marks.read = ["file"]
marks.shell = ["command"]

[commands.bash]
parser = "posix"
arguments = [
  ["file", "command=-c:"], "positional...", "option=-o:", "shopt=-O:", "--rcfile|--init-file:",
  "--login|-l", "interactive=-i", "errexit=-e", "xtrace=-x", "nounset=-u", "verbose=-v",
  "noexec=-n", "stdin=-s", "--norc", "--noprofile", "--posix", "--restricted|-r",
]
marks.read = ["file", "rcfile"]
marks.shell = ["command"]

[commands.dash]
parser = "posix"
arguments = [
  ["file", "command=-c:"], "positional...", "option=-o:", "--login|-l", "interactive=-i",
  "errexit=-e", "xtrace=-x", "nounset=-u", "verbose=-v", "noexec=-n", "stdin=-s",
]
marks.read = ["file"]
marks.shell = ["command"]

[commands.zsh]
parser = "posix"
arguments = [
  ["file", "command=-c:"], "positional...", "option=-o:", "--login|-l", "interactive=-i",
  "errexit=-e", "xtrace=-x", "nounset=-u", "verbose=-v", "noexec=-n", "stdin=-s", "no_rcs=-f",
]
marks.read = ["file"]
marks.shell = ["command"]

# cd and pushd move the rest of their && chain to `dir`. `cd -` and `pushd +N` take a directory
# from the stack, so `dir` takes no word that starts with `-` or `+`, and the cwd is Unknown.
# pushd's -n keeps the directory; it stays undeclared, so the cwd after it is Unknown too.

[commands.cd]
parser = "posix"
arguments = ["dir", "logical=-L", "physical=-P", "exit_on_error=-e"]
argument.dir.default = ["~"]
argument.dir.match = "[!+-]*"
marks.cwd = ["dir"]

[commands.pushd]
parser = "posix"
arguments = ["dir"]
argument.dir.match = "[!+-]*"
marks.cwd = ["dir"]

[commands.popd]
parser = "posix"
arguments = ["entry", "no_change=-n"]

# =============================================================================
# Writers
# =============================================================================

[commands.rm]
parser = "gnu"
arguments = [
  "files...", "--recursive|-r|-R", "--force|-f", "--interactive|-i", "once=-I", "--verbose|-v",
  "--dir|-d",
]
marks.write = ["files"]

[commands.rmdir]
parser = "gnu"
arguments = ["files...", "--parents|-p", "--verbose|-v", "--ignore-fail-on-non-empty"]
marks.write = ["files"]

[commands.mkdir]
parser = "gnu"
arguments = ["files...", "--mode|-m:", "--parents|-p", "--verbose|-v"]
marks.write = ["files"]

[commands.touch]
parser = "gnu"
arguments = [
  "files...", "--reference|-r:", "--date|-d:", "stamp=-t:", "-a", "-m", "--no-create|-c",
  "--no-dereference|-h",
]
marks.read = ["reference"]
marks.write = ["files"]

[commands.tee]
parser = "gnu"
arguments = ["files...", "--append|-a", "--ignore-interrupts|-i"]
marks.write = ["files"]

[commands.cp]
parser = "gnu"
arguments = [
  "files...", ["dest", "--target-directory|-t:"], "--suffix|-S:",
  "--recursive|-r|-R", "--archive|-a", "--force|-f", "--interactive|-i", "--no-clobber|-n", "-p",
  "--preserve", "--verbose|-v", "--update|-u", "--dereference|-L", "--no-dereference|-P",
  "--link|-l", "--symbolic-link|-s", "--no-target-directory|-T", "--parents",
]
marks.read = ["files"]
marks.write = ["dest", "target_directory"]

[commands.mv]
parser = "gnu"
arguments = [
  "files...", ["dest", "--target-directory|-t:"], "--suffix|-S:",
  "--force|-f", "--interactive|-i", "--no-clobber|-n", "--verbose|-v", "--update|-u",
  "--no-target-directory|-T",
]
marks.write = ["files", "dest", "target_directory"]   # a moved source is removed

[commands.ln]
parser = "gnu"
arguments = [
  "files...", ["dest", "--target-directory|-t:"], "--suffix|-S:",
  "--symbolic|-s", "--force|-f", "--no-dereference|-n", "--verbose|-v", "--relative|-r",
  "--no-target-directory|-T", "--logical|-L", "--physical|-P",
]
marks.read = ["files"]
marks.write = ["dest", "target_directory"]

[commands.chmod]
parser = "gnu"
arguments = [["mode", "--reference:"], "files...", "--recursive|-R", "--verbose|-v", "--changes|-c", "--silent|--quiet|-f"]
marks.read = ["reference"]
marks.write = ["files"]

[commands.chown]
parser = "gnu"
arguments = [["owner", "--reference:"], "files...", "--recursive|-R", "--verbose|-v", "--changes|-c", "--silent|--quiet|-f"]
marks.read = ["reference"]
marks.write = ["files"]

[commands.chgrp]
parser = "gnu"
arguments = [["group", "--reference:"], "files...", "--recursive|-R", "--verbose|-v", "--changes|-c", "--silent|--quiet|-f"]
marks.read = ["reference"]
marks.write = ["files"]

# --- Signals: the signal is a value, so a rule can tell SIGKILL from the default ---

# Each reads -9 and -KILL as its signal; a name it does not list reads as flags.
[commands.kill]
parser = "posix"
arguments = ["pids...", "--signal|-s:", "signal_number=-n:", "--list|-l", "--table|-L"]
argument.signal.dash = true
argument.signal.words = [
  "HUP", "INT", "QUIT", "ILL", "TRAP", "ABRT", "BUS", "FPE", "KILL", "USR1", "SEGV", "USR2",
  "PIPE", "ALRM", "TERM", "CHLD", "CONT", "STOP", "TSTP", "TTIN", "TTOU", "WINCH",
  "SIGHUP", "SIGINT", "SIGQUIT", "SIGILL", "SIGTRAP", "SIGABRT", "SIGBUS", "SIGFPE", "SIGKILL",
  "SIGUSR1", "SIGSEGV", "SIGUSR2", "SIGPIPE", "SIGALRM", "SIGTERM", "SIGCHLD", "SIGCONT",
  "SIGSTOP", "SIGTSTP", "SIGTTIN", "SIGTTOU", "SIGWINCH",
]

# pkill's -s is the session, not the signal.
[commands.pkill]
parser = "gnu"
arguments = [
  "pattern", "--signal:", "--full|-f", "--exact|-x", "--newest|-n", "--oldest|-o", "--echo|-e",
  "--count|-c", "--ignore-case|-i", "--euid|-u:", "--uid|-U:", "--pgroup|-g:", "--group|-G:",
  "--parent|-P:", "--session|-s:", "--terminal|-t:",
]
argument.signal.dash = true
argument.signal.words = [
  "HUP", "INT", "QUIT", "ILL", "TRAP", "ABRT", "BUS", "FPE", "KILL", "USR1", "SEGV", "USR2",
  "PIPE", "ALRM", "TERM", "CHLD", "CONT", "STOP", "TSTP", "TTIN", "TTOU", "WINCH",
  "SIGHUP", "SIGINT", "SIGQUIT", "SIGILL", "SIGTRAP", "SIGABRT", "SIGBUS", "SIGFPE", "SIGKILL",
  "SIGUSR1", "SIGSEGV", "SIGUSR2", "SIGPIPE", "SIGALRM", "SIGTERM", "SIGCHLD", "SIGCONT",
  "SIGSTOP", "SIGTSTP", "SIGTTIN", "SIGTTOU", "SIGWINCH",
]

[commands.killall]
parser = "gnu"
arguments = [
  "names...", "--signal|-s:", "--exact|-e", "--ignore-case|-I", "--process-group|-g",
  "--interactive|-i", "--list|-l", "--quiet|-q", "--regexp|-r", "--user|-u:", "--verbose|-v",
  "--wait|-w", "--younger-than|-y:", "--older-than|-o:",
]
argument.signal.dash = true
argument.signal.words = [
  "HUP", "INT", "QUIT", "ILL", "TRAP", "ABRT", "BUS", "FPE", "KILL", "USR1", "SEGV", "USR2",
  "PIPE", "ALRM", "TERM", "CHLD", "CONT", "STOP", "TSTP", "TTIN", "TTOU", "WINCH",
  "SIGHUP", "SIGINT", "SIGQUIT", "SIGILL", "SIGTRAP", "SIGABRT", "SIGBUS", "SIGFPE", "SIGKILL",
  "SIGUSR1", "SIGSEGV", "SIGUSR2", "SIGPIPE", "SIGALRM", "SIGTERM", "SIGCHLD", "SIGCONT",
  "SIGSTOP", "SIGTSTP", "SIGTTIN", "SIGTTOU", "SIGWINCH",
]

# --- Programs with their own language ---

[commands.sed]
parser = "gnu"
arguments = [
  ["script", "--expression|-e:", "--file|-f:"], "files...", "--line-length|-l:",
  "--quiet|--silent|-n", "--regexp-extended|-E|-r", "--in-place|-i", "--separate|-s",
  "--null-data|-z", "--unbuffered|-u", "--posix", "--debug", "--sandbox",
]
marks.read = ["files", "file"]

[commands.awk]
parser = "gnu"
arguments = [
  ["program", "--source|-e:", "--file|-f|--include|-i:"],
  "files...", "--field-separator|-F:", "--assign|-v:",
]
marks.read = ["files", "file"]

[commands.gawk]
parser = "gnu"
arguments = [
  ["program", "--source|-e:", "--file|-f|--include|-i:"],
  "files...", "--field-separator|-F:", "--assign|-v:",
]
marks.read = ["files", "file"]

# mawk and nawk reject --source; declaring it reads no line they accept differently, and lets
# one rule cover every awk.
[commands.mawk]
parser = "gnu"
arguments = [["program", "--source:", "--file|-f:"], "files...", "--field-separator|-F:", "--assign|-v:"]
marks.read = ["files", "file"]

[commands.nawk]
parser = "posix"
arguments = [["program", "--source:", "file=-f:"], "files...", "field_separator=-F:", "assign=-v:"]
marks.read = ["files", "file"]

# =============================================================================
# Tools with subcommands
# =============================================================================

[commands.git]
parser = "gnu"
arguments = [
  "dir=-C:", "--git-dir:", "--work-tree:", "config=-c:", "--config-env:", "--namespace:",
  "--exec-path", "--no-pager|-P", "--paginate|-p", "--bare", "--no-replace-objects",
  "--literal-pathspecs", "--no-optional-locks", "subcommand",
]
argument.dir.default = ["."]                          # git reads the repository of its directory
# git won't let an alias shadow a built-in, so a listed name is never an
# alias for `push`; an unlisted one could be, and stays Unknown.
argument.subcommand.words = [
