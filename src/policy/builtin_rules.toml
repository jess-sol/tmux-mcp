action = "deny"
message = "dynamic command dispatch isn't allowed: with neither -c nor a script file, the shell runs what it reads from standard input"

[[rules]]
id = "bash-reads-stdin"
command = "bash"
when = 'args.command == [] && args.file == null'
action = "deny"
message = "dynamic command dispatch isn't allowed: with neither -c nor a script file, the shell runs what it reads from standard input"

[[rules]]
id = "dash-reads-stdin"
command = "dash"
when = 'args.command == [] && args.file == null'
action = "deny"
message = "dynamic command dispatch isn't allowed: with neither -c nor a script file, the shell runs what it reads from standard input"

