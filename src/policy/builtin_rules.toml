[[rules]]
id = "file-tools"
when = '''
  command.name in ["cat", "less", "more", "wc", "file", "stat", "realpath", "readlink", "diff",
                   "base64", "md5sum", "sha256sum", "uniq", "head", "tail", "ls", "tree", "cut", "sort",
                   "grep", "egrep", "fgrep", "rg", "find", "mkdir", "rmdir", "touch", "tee", "cp", "mv",
                   "ln", "rm", "sed", "awk", "gawk", "mawk", "nawk"]
'''
action = "allow"

[[rules]]
id = "cargo"
command = "cargo"
action = "allow"

[[rules]]
id = "git-reads"
command = "git"
when = '''
  subcommand in ["status", "log", "diff", "show", "shortlog", "blame", "ls-files", "ls-tree",
                 "rev-parse", "describe", "cat-file", "grep"]
'''
action = "allow"

[[rules]]
id = "git-remote-listings"
command = "git remote"
when = 'subcommand in [null, "show", "get-url"]'
action = "allow"

[[rules]]
id = "git-stash-listings"
command = "git stash"
when = 'subcommand in ["list", "show"]'
action = "allow"

[[rules]]
id = "git-reflog-listings"
command = "git reflog"
when = 'subcommand in [null, "show"]'
action = "allow"

[[rules]]
id = "git-branch-listings"
command = "git branch"
when = '''
  (args.list || args.names == [])
  && !(args.delete || args.force_delete || args.move || args.force_move || args.copy || args.force_copy
       || args.unset_upstream || args.edit_description || args.set_upstream_to != [])
'''
action = "allow"

[[rules]]
id = "git-tag-listings"
command = "git tag"
when = '(args.list || args.names == []) && !args.delete'
action = "allow"

[[rules]]
id = "git-config-reads"
command = "git config"
when = '''
  !(args.unset || args.unset_all || args.add || args.replace_all || args.edit
    || args.rename_section || args.remove_section)
  && (args.list || args.get || args.get_all || args.get_regexp
      || args.names.size() == 1 || args.names.size() > 0 && args.names[0] in ["get", "list"])
'''
action = "allow"
